# This config is only loaded by the dedicated herdr-lazygit tmux server.
set -g destroy-unattached off
set -s exit-unattached off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s escape-time 0

# Pass normal keys through to LazyGit; Ctrl+g hides the popup safely.
set -g prefix None
set -g prefix2 None
bind-key -n C-g detach-client

set -g status-left " Ctrl+g: hide | q: quit "
set -g status-left-length 40
set -g status-right ""
set -g status-style "fg=colour250,bg=default"
set -g window-status-current-format ""
set -g window-status-format ""
