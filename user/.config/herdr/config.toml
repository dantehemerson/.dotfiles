onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#00ffff"
active_row_bg = "#ff0000"
selection_bg = "#00ff00"
green = "#a6e3a1"
blue = "#0000ff"
red = "#0000ff"
yellow = "#f9e2af"


[keys]
prefix = "`"
detach = "prefix+d"
previous_agent = "prefix+ctrl+k"
next_agent = "prefix+ctrl+j"
focus_agent = "prefix+ctrl+1..9"
split_vertical = "prefix+|"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
goto = "prefix+/"
rename_tab = "prefix+,"
rename_pane = "prefix+."

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "70%"
height = "90%"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "dantehemerson.last-tab.toggle"
description = "last tab"

[ui]
sidebar_width=30
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
right_click_passthrough_modifier = "alt"
pane_scrollbars = false
pane_borders = "always"

tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  { type = "text", text = "prod" },
]
tab_bar_right_separator = " · "

status_indicators = "symbols"


[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["state_text", "agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]


[ui.sound]
# Play sounds when agents change state in background workspaces
enabled = true

[ui.toast]
delivery = "terminal"
