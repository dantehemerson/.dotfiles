onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#00ffff"
active_row_bg = "#31364d"
selection_bg = "darkgray"

# Sidebar
surface_dim = "#555" # Sidebar Borders
text = "#eaeefd" # Selected Space title
mauve = "#00ffff" # Selected branch name
overlay0 = "#636c95" # Unselected branch and Sidebar titles/buttons
# subtext0 = "yellow" # Unselected Space title:
# overlay1 = "white" # Title Left(Project Icon)


# 
# surface0 = "red" # Unselected tab Background

surface1 = "red"


[keys]
prefix = "`"
detach = "prefix+d"
previous_agent = "prefix+ctrl+k"
next_agent = "prefix+ctrl+j"
focus_agent = "prefix+ctrl+1..9"
split_vertical = "prefix+|"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
goto = "prefix+/"
rename_tab = "prefix+,"
rename_pane = "prefix+."

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "70%"
height = "90%"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "dantehemerson.last-tab.toggle"
description = "last tab"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle reviewr"

[ui]
agent_panel_sort = "spaces"
sidebar_width=36
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
right_click_passthrough_modifier = "alt"
pane_scrollbars = false
pane_borders = "always"

tab_bar_right = [{ type = "text", text = "Good Moorning Dante!" }]
tab_bar_right_separator = " · "

status_indicators = "symbols"
pane_gaps = true
tab_bar_position = "top"


[ui.sound]
# Play sounds when agents change state in background workspaces
enabled = true

[ui.toast]
delivery = "terminal"

# Workspace -> title -> agent/status layout.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped" }],
  [
    { token = "state_icon" },
    { token = "agent" },
    { token = "state_text" },
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped" }],
  [
    { token = "state_icon" },
    { token = "agent" },
    { token = "state_text" },
  ],
]
codex = [
  [{ token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped" }],
  [
    { token = "state_icon" },
    { token = "agent" },
    { token = "state_text" },
  ],
]

opencode = [
  [{ token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped" }],
  [
    { token = "state_icon" },
    { token = "agent" },
    { token = "state_text" },
  ],
]

[ui.sidebar.spaces]
rows = [
  [
  "state_icon", 
  { token = "workspace" }],
  ["branch"]
]
